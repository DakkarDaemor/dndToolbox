<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>D&D Toolbox — Forgotten Realms</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
:root {
  --bg:       #0f0d0b;
  --bg2:      #1a1612;
  --bg3:      #221e18;
  --bg4:      #2a2520;
  --gold:     #d4b05a;
  --gold2:    #ecd070;
  --gold-dim: #a07c3a;
  --red:      #8b2020;
  --red2:     #e05040;
  --green:    #2d5a3d;
  --green2:   #4a9060;
  --purple:   #4a3060;
  --purple2:  #7a50a0;
  --text:     #ddd0b5;
  --text2:    #a89878;
  --text3:    #8a7a62;
  --border:   #3a3228;
  --border2:  #4a4238;
  --radius:   6px;
  --radius2:  10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IM Fell English',Georgia,serif;overflow-x:hidden}
body{display:flex;flex-direction:column;min-height:100dvh}

/* HEADER */
.hdr{padding:12px 16px 10px;background:var(--bg2);border-bottom:1px solid var(--gold-dim);display:flex;align-items:center;gap:10px;flex-shrink:0}
.hdr-icon{font-size:22px;line-height:1}
.hdr-title{font-family:'Cinzel',serif;font-size:15px;font-weight:700;color:var(--gold);letter-spacing:.04em;line-height:1.2}
.hdr-sub{font-size:11px;color:#a89878;font-style:italic;line-height:1.3}
.hdr-export{margin-left:auto;background:transparent;border:1px solid var(--gold-dim);border-radius:var(--radius);padding:6px 10px;color:var(--gold);font-family:'Cinzel',serif;font-size:11px;cursor:pointer;white-space:nowrap}
.hdr-export:active{background:var(--bg3)}

/* MAIN SCROLL AREA */
.main{flex:1;overflow-y:auto;padding:14px 14px 80px;-webkit-overflow-scrolling:touch}

/* BOTTOM NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--gold-dim);display:flex;z-index:100;padding-bottom:env(safe-area-inset-bottom)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 2px;gap:3px;background:transparent;border:none;cursor:pointer;color:#9a8e78;transition:color .15s;font-size:9px;font-family:'Cinzel',serif;letter-spacing:.03em;min-height:52px}
.nav-btn .ico{font-size:18px;line-height:1}
.nav-btn.on{color:var(--gold)}
.nav-btn.on .ico{text-shadow:0 0 8px rgba(201,168,76,.4)}

/* PANEL */
.panel{animation:fi .2s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* CONTROLS */
.ctrl{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
select,input[type=text]{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 12px;color:var(--text);font-family:'IM Fell English',serif;font-size:14px;flex:1;min-width:0;appearance:none;-webkit-appearance:none;outline:none}
select:focus,input:focus{border-color:var(--gold-dim)}
.btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 16px;color:var(--text);font-family:'Cinzel',serif;font-size:12px;cursor:pointer;white-space:nowrap;letter-spacing:.03em;transition:all .12s}
.btn:active{background:var(--bg4);transform:scale(.97)}
.btn.p{border-color:var(--gold-dim);color:var(--gold);font-weight:600}
.btn.p:active{border-color:var(--gold)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-full{width:100%;justify-content:center}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius2);padding:14px;margin-bottom:10px;position:relative}
.card-lbl{font-family:'Cinzel',serif;font-size:10px;color:#9a8c72;text-transform:uppercase;letter-spacing:.1em;margin-bottom:4px}
.card-val{font-size:13px;color:var(--text);line-height:1.6}
.card-big{font-family:'Cinzel',serif;font-size:15px;color:var(--gold);line-height:1.3}
.card-del{position:absolute;top:10px;right:10px;background:transparent;border:none;color:#7a6e58;font-size:18px;cursor:pointer;padding:2px 6px;line-height:1;border-radius:var(--radius)}
.card-del:active{color:var(--red2)}
.del-confirm{display:flex;align-items:center;gap:8px;background:var(--bg3);border:1px solid var(--red);border-radius:var(--radius);padding:6px 10px;margin-top:6px;font-size:12px;font-family:'Cinzel',serif;color:#e8a090}
.del-confirm button{background:transparent;border:1px solid currentColor;border-radius:var(--radius);padding:3px 10px;cursor:pointer;font-family:'Cinzel',serif;font-size:11px}
.del-confirm .del-yes{color:var(--red2);border-color:var(--red)}
.del-confirm .del-no{color:var(--text2)}
.card-sav{background:transparent;border:1px solid var(--border2);border-radius:var(--radius);padding:5px 12px;color:#a89878;font-family:'Cinzel',serif;font-size:11px;cursor:pointer;margin-top:8px}
.card-sav:active{border-color:var(--gold-dim);color:var(--gold)}

/* GRIDS */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:360px){.grid2{grid-template-columns:1fr}}

/* BADGES */
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.badge{font-family:'Cinzel',serif;font-size:10px;padding:3px 8px;border-radius:4px;font-weight:600}
.b-c  {background:#2a2520;color:#a89878;border:1px solid #4a4238}
.b-nc {background:#1a2e22;color:#5cb87a;border:1px solid #2d5a3d}
.b-r  {background:#1a2035;color:#6090d8;border:1px solid #2a3560}
.b-mr {background:#251a35;color:#a070e0;border:1px solid #4a3060}
.b-l  {background:#2a2010;color:#d4b05a;border:1px solid #a07c3a}
.b-a  {background:#2a1510;color:#f06050;border:1px solid #8b2020}
.b-zon{background:#1e1a14;color:#a89878;border:1px solid #4a4238}

/* PNG DETAIL */
.png-detail{border-left:2px solid var(--gold-dim);padding-left:12px;margin:8px 0}
.png-row{margin-bottom:4px;font-size:13px;color:var(--text)}
.png-row .fl{color:#a89878;font-size:11px;font-style:italic}

/* SECTION TITLE */
.stit{font-family:'Cinzel',serif;font-size:12px;font-weight:600;color:#a07c3a;margin:14px 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.06em}

/* LOADING */
.loading::after{content:'.';animation:dt 1.2s steps(3,end) infinite}
@keyframes dt{0%,20%{content:'.'}40%,60%{content:'..'}80%,100%{content:'...'}}
.loading{color:#a89878;font-size:13px;font-style:italic;padding:8px 0}

/* MSG TOAST */
.toast-wrap{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:200;pointer-events:none}
.toast{background:var(--bg3);border:1px solid var(--gold-dim);border-radius:var(--radius);padding:6px 16px;font-family:'Cinzel',serif;font-size:12px;color:var(--gold);white-space:nowrap;animation:tIn .2s ease,tOut .3s ease 1.6s forwards}
@keyframes tIn{from{opacity:0;top:-10px}to{opacity:1;top:0}}
@keyframes tOut{to{opacity:0}}

/* IO ROW */
.io-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.file-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:9px 14px;color:#a89878;font-family:'Cinzel',serif;font-size:12px;cursor:pointer;display:inline-block}
.file-btn:active{border-color:var(--gold-dim);color:var(--gold)}

/* EMPTY STATE */
.empty{text-align:center;padding:3rem 1rem;color:#8a7a62;font-style:italic;font-size:14px}
.empty .big{font-family:'Cinzel',serif;font-size:32px;margin-bottom:8px;opacity:.3}

/* ORNAMENT */
.ornament{text-align:center;color:#c9983a;font-size:12px;letter-spacing:.25em;margin:6px 0 14px;font-family:'Cinzel',serif}

/* MSG BAR */
.msgbar{background:var(--bg3);border:1px solid var(--gold-dim);border-radius:var(--radius);padding:8px 12px;font-family:'Cinzel',serif;font-size:12px;color:var(--gold);margin-bottom:12px}

/* DIVIDER */
.div{height:1px;background:var(--border);margin:12px 0}

/* SCROLL FIX */
select option{background:var(--bg2)}
/* STAT BLOCK */
.stat-block{display:table;width:100%;margin:6px 0;border-collapse:collapse}
.stat-row{display:table-row}
.stat-lbl{display:table-cell;font-family:'Cinzel',serif;font-size:10px;color:#9a8c72;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px 3px 0;white-space:nowrap;vertical-align:top;width:1%}
.stat-val{display:table-cell;font-size:13px;color:var(--text);padding:3px 0;line-height:1.4;vertical-align:top}

/* AI DETAIL */
.ai-detail{border-top:1px solid var(--border);margin-top:10px;padding-top:8px;display:table;width:100%;border-collapse:collapse}
.ai-row{display:table-row}
.ai-lbl{display:table-cell;font-family:'Cinzel',serif;font-size:12px;color:#c9983a;text-transform:uppercase;letter-spacing:.06em;padding:3px 10px 3px 0;white-space:nowrap;vertical-align:top;width:1%}
.ai-val{display:table-cell;font-size:14px;color:var(--text);padding:3px 0;line-height:1.5;vertical-align:top}
.ai-lore .ai-val{font-style:italic;color:#a89878}
.ai-toggle{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;border-top:1px solid var(--border);margin-top:8px;padding-top:6px;font-family:'Cinzel',serif;font-size:10px;color:#c9983a;text-transform:uppercase;letter-spacing:.06em}
.ai-toggle .arr{font-size:10px;transition:transform .2s;display:inline-block}
.ai-toggle.open .arr{transform:rotate(90deg)}
.ai-body{display:none;padding-top:4px}
.ai-body.open{display:table;width:100%;border-collapse:collapse}

/* CONFIG OVERLAY */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay-box{background:var(--bg2);border:1px solid var(--gold-dim);border-radius:var(--radius2);padding:24px 20px;width:100%;max-width:380px}
.overlay-title{font-family:'Cinzel',serif;font-size:16px;font-weight:700;color:var(--gold);margin-bottom:6px}
.overlay-sub{font-size:13px;color:#a89878;font-style:italic;margin-bottom:18px;line-height:1.6}
.overlay-label{font-family:'Cinzel',serif;font-size:11px;color:#9a8c72;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;display:block}
.overlay-input{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius);padding:10px 12px;color:var(--text);font-family:'IM Fell English',serif;font-size:14px;outline:none;margin-bottom:6px}
.overlay-input:focus{border-color:var(--gold-dim)}
.overlay-hint{font-size:12px;color:#a89878;margin-bottom:18px;line-height:1.6}
.overlay-hint a{color:var(--gold);text-decoration:none}
.overlay-btns{display:flex;gap:8px}
.key-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;vertical-align:middle}
.key-ok{background:#4a9060}.key-no{background:#8b2020}
.hdr-cfg{background:transparent;border:none;color:#9a8e78;font-size:16px;cursor:pointer;padding:4px 7px;border-radius:var(--radius);line-height:1;margin-left:2px}
.hdr-cfg:active{background:var(--bg3)}

</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-icon">⚔</div>
  <div>
    <div class="hdr-title">D&D Toolbox</div>
    <div class="hdr-sub">Forgotten Realms · Waterdeep · Sottomonte</div>
  </div>
  <div style="margin-left:auto;display:flex;align-items:center;gap:4px">
    <span id="key-status" title="API Key"></span>
    <button class="hdr-export" onclick="exportJSON()">↓ Esporta</button>
    <button class="hdr-cfg" onclick="openConfig()" title="Configurazione API Key">⚙</button>
  </div>
</div>

<div class="overlay" id="overlay" style="display:none">
  <div class="overlay-box">
    <div class="overlay-title">⚙ Configurazione API</div>
    <div class="overlay-sub">Inserisci la tua API key di Anthropic per abilitare la generazione AI (PNG, Luoghi, Idee).</div>
    <label class="overlay-label">Anthropic API Key</label>
    <input class="overlay-input" type="password" id="cfg-key" placeholder="sk-ant-..." autocomplete="off" spellcheck="false">

      Ottienila su <a href="https://console.anthropic.com/keys" target="_blank">console.anthropic.com</a>
    </div>
    <div class="overlay-btns">
      <button class="btn p" style="flex:1" onclick="saveConfig()">Salva</button>

<div class="toast-wrap" id="toastWrap"></div>

  <div id="panel-idee" class="panel" style="display:none"></div>
  <div id="panel-salvati" class="panel" style="display:none"></div>
</div>

  <button class="nav-btn" data-tab="oggetti" onclick="switchTab('oggetti')"><span class="ico">⚒</span>Oggetti</button>
  <button class="nav-btn" data-tab="loot" onclick="switchTab('loot')"><span class="ico">💰</span>Loot</button>

  <button class="nav-btn" data-tab="salvati" onclick="switchTab('salvati')" id="nav-salvati"><span class="ico">📜</span>Salvati</button>
</nav>

function pick(a){return a[Math.floor(Math.random()*a.length)];}
function pickN(a,n){return [...a].sort(()=>Math.random()-.5).slice(0,n);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── AI ────────────────────────────────────────────────────────────────────────
async function ai(prompt,sys){
  if(!IN_CLAUDE && (!apiKey||!apiKey.startsWith('sk-ant-'))){
    openConfig();
    throw new Error('API Key mancante');
  }
  const headers={'Content-Type':'application/json','anthropic-version':'2023-06-01'};
  if(!IN_CLAUDE){
    headers['x-api-key']=apiKey;
    headers['anthropic-dangerous-direct-browser-access']='true';
  }
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers,
      body:JSON.stringify({model:aiModel,max_tokens:1000,
        system:sys||'Sei un assistente D&D 5e per i Forgotten Realms (Waterdeep, Sottomonte, Costa della Spada). Rispondi in italiano, sintetico e evocativo.',
        messages:[{role:'user',content:prompt}]})
    });
  }catch(fetchErr){
    // Network error or CORS block
    const isCors=fetchErr.message&&(fetchErr.message.includes('fetch')||fetchErr.message.includes('CORS')||fetchErr.message.includes('network'));
    if(isCors||fetchErr instanceof TypeError){
      showDiag('Errore di rete. Se stai aprendo il file con file://, prova a usarlo tramite un server HTTP (es. GitHub Pages, o un server locale). Dettaglio: '+fetchErr.message);
    } else {
      showDiag('Errore fetch: '+fetchErr.message);
    }
    throw fetchErr;
  }
  if(!r.ok){
    let errBody={};
    try{errBody=await r.json();}catch{}
    const msg=errBody.error?.message||('Errore HTTP '+r.status);
    if(r.status===401){
      apiKey='';
      try{localStorage.removeItem(KEY_STORAGE);}catch{}
      updateKeyStatus();
      showDiag('API Key non valida (401). Controlla che la chiave sia corretta e attiva su console.anthropic.com');
      openConfig();
    } else if(r.status===403){
      showDiag('Accesso negato (403). Potrebbe essere un blocco CORS. Prova a servire il file via HTTP invece di file://');
    } else {
      showDiag('Errore API '+r.status+': '+msg);
    }
    throw new Error(msg);
  }
  const d=await r.json();
  return d.content?.[0]?.text||'Errore.';
}

function showDiag(msg){
  // Show persistent diagnostic message with copy button
  let diag=document.getElementById('diag-bar');
  if(!diag){
    diag=document.createElement('div');
    diag.id='diag-bar';
    diag.style.cssText='position:fixed;bottom:60px;left:0;right:0;background:#2a1510;border-top:1px solid #8b2020;padding:10px 14px;z-index:150;font-size:12px;color:#e8a090;font-family:monospace;line-height:1.5;display:flex;gap:10px;align-items:flex-start';
    document.body.appendChild(diag);
  }
  const span=document.createElement('span');
  span.style.flex='1';
  span.textContent='⚠ '+msg;
  const closeBtn=document.createElement('button');
  closeBtn.textContent='×';
  closeBtn.style.cssText='background:transparent;border:none;color:#e8a090;font-size:16px;cursor:pointer;padding:0 4px;flex-shrink:0';
  closeBtn.onclick=()=>diag.remove();
  diag.innerHTML='';
  diag.appendChild(span);
  diag.appendChild(closeBtn);
}

function applyRarToObj(obj, tipo, rar){
  // Clone and adjust nome/danno/valore based on rarity
  let nome=obj.n||obj;
  let danno=obj.d||'';
  let prop=obj.p||'';
  const peso=obj.w||'';
  // For weapons and armour apply bonus suffix to name and damage
  const bonus=BONUS_BY_RAR[rar];
  if(bonus && (tipo==='arma'||tipo==='armatura')){
    nome=nome+' '+bonus;
    if(tipo==='arma' && danno){
      // prepend bonus to damage string
      const b=bonus.replace(' (leggendaria)','').replace(' (artefatto)','');
      danno=danno+', '+b+' att/danno';
    }
    if(tipo==='armatura' && danno){
      const b=bonus.replace(' (leggendaria)','').replace(' (artefatto)','');
      danno=danno+', '+b+' CA';
    }
    if(rar!=='Comune') prop=(prop?prop+', ':'')+'sintonizzazione';
  }
  // Override value with rarity-appropriate range
  const varTable=VALORE_BY_RAR[tipo]||{};
  const valore=varTable[rar]||obj.v||'';
  return {nome, danno, prop, peso, valore};
}

function renderSalvati(){
  const el=document.getElementById('panel-salvati');
  if(saved.length===0){

      <div class="io-row">

      </div>
      <div class="empty"><div class="big">📜</div>Nessun elemento salvato.</div>`;
    return;
  }
  const grouped=saved.reduce((acc,item,i)=>{if(!acc[item.tipo])acc[item.tipo]=[];acc[item.tipo].push({...item,_i:i});return acc;},{});
  let html=`
    <div class="ornament">— Archivio di Sessione —</div>
    <div class="io-row">
      <button class="btn" onclick="exportJSON()">↓ Esporta JSON</button>
      <label class="file-btn">↑ Importa<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label>
      <button class="btn" style="font-size:11px;color:var(--red2);border-color:var(--red)" onclick="if(confirm('Cancellare tutto?')){saved=[];persist();updateSavedBadge();renderSalvati();}">Cancella tutto</button>
    </div>`;
  for(const [tipo,items] of Object.entries(grouped)){
    html+=`<div class="stit">${esc(tipo)}</div>`;
    for(const item of items){
      html+=`<div class="card" id="card-${item._i}">
        <button class="card-del" onclick="deleteItem(${item._i})">×</button>`;
      if(item.tipo==='png'&&item.nome){
        let d=item;try{if(typeof item.contenuto==='string'&&item.contenuto.startsWith('{'))d={...item,...JSON.parse(item.contenuto)};}catch{}
        html+=`<div class="card-big">${esc(d.nome||'')}</div>
          <div class="tags">
            ${d.razza?`<span class="badge b-c">${esc(d.razza)}</span>`:''}
            ${d.ruolo?`<span class="badge b-nc">${esc(d.ruolo)}</span>`:''}
          </div>
          <div class="png-detail" style="margin-top:8px">
            ${d.fr?`<div class="png-row"><span class="fl">FR: </span>${esc(d.fr)}</div>`:''}
            ${d.segreto?`<div class="png-row"><span class="fl">segreto: </span>${esc(d.segreto)}</div>`:''}
          </div>`;
      } else {
        if(item.zona)html+=`<div class="tags" style="margin-bottom:4px"><span class="badge b-zon">${esc(item.zona)}</span></div>`;
        if(item.tipo==='nome')html+=`<div class="tags" style="margin-bottom:4px"><span class="badge b-c">${item.genere==='m'?'M':'F'}</span><span class="badge b-c">${esc(item.razza||'')}</span></div>`;

        if(item.tipo==='oggetto'){
          html+=`<div class="card-big" style="font-size:14px;margin-bottom:6px">${esc(item.contenuto)}</div>`;
          html+=`<div class="tags" style="margin-bottom:8px"><span class="badge ${RAR_CLASS[item.rarità]||'b-c'}">${esc(item.rarità||'')}</span><span class="badge b-c">${esc(item.sottotipo||'')}</span></div>`;
          const rows=[];
          if(item.danno) rows.push([item.sottotipo==='armatura'?'CA':'Danno', item.danno]);
          if(item.prop)  rows.push(['Proprietà', item.prop]);
          if(item.peso)  rows.push(['Peso', item.peso]);
          if(item.valore)rows.push(['Valore', item.valore]);
          if(rows.length) html+=`<div class="stat-block">${rows.map(([l,v])=>statRow(l,v)).join('')}</div>`;
          // AI fields
          const aiRows=[];
          if(item.effetto)  aiRows.push(['Effetto', item.effetto]);
          if(item.aspetto)  aiRows.push(['Aspetto', item.aspetto]);
          if(item.lore||item.storia) aiRows.push(['Lore', item.lore||item.storia]);
          if(aiRows.length){const uid='sv'+item._i+'o';html+=aiDetailHTML(aiRows.map(([l,v])=>({lbl:l,val:v,lore:l==='Lore'})),uid);}
        } else if(item.tipo==='loot'){
          html+=`<div class="card-val" style="font-weight:600;margin-bottom:4px">${esc(item.contenuto)}</div>`;
          if(item.note) html+=`<div class="stat-block">${statRow('Note',item.note)}</div>`;
          const aiLootRows=[];
          if(item.effetto)  aiLootRows.push(['Effetto', item.effetto]);
          if(item.dettaglio)aiLootRows.push(['Dettaglio', item.dettaglio]);
          if(aiLootRows.length){const uid='sv'+item._i+'l';html+=aiDetailHTML(aiLootRows.map(([l,v])=>({lbl:l,val:v,lore:l==='Dettaglio'})),uid);}
        } else {
          html+=`<div class="card-val" style="${item.tipo==='nome'?"font-family:'Cinzel',serif;color:var(--gold)":''}">${esc(item.contenuto)}</div>`;
        }
      }
      html+='</div>';
    }
  }
  el.innerHTML=html;
}

// ── EXPORT/IMPORT ─────────────────────────────────────────────────────────────
function exportJSON(){
  const d={version:'1.0',ambientazione:'Forgotten Realms — Waterdeep/Sottomonte',exportedAt:new Date().toISOString(),items:saved};
  const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);
  const a=document.createElement('a');
  a.href=u;a.download='dnd-sessione-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(u);
  toast('File scaricato!');
}
function importJSON(file){
  if(!file)return;
  const r=new FileReader();
  r.onload=e=>{
    try{
      const d=JSON.parse(e.target.result);
      const arr=d.items||(Array.isArray(d)?d:[]);
      if(!arr.length){showMsg('File vuoto o formato non riconosciuto.');return;}
      if(confirm('Aggiungere '+arr.length+' elementi a quelli esistenti?\nAnnulla = sostituisce tutto')){
        saved=[...arr,...saved];
      }else{saved=arr;}
      persist();updateSavedBadge();
      showMsg(arr.length+' elementi importati.');
      if(currentTab==='salvati')renderSalvati();
    }catch{showMsg('Errore: JSON non valido.');}
  };
  r.readAsText(file);
}
